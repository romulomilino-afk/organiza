<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organiza — sem conexão</title>
<style>
  :root { --bg:#F5F7F6; --ink:#141B19; --ink2:#4E5B57; --accent:#17624F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0E1312; --ink:#E9EFEC; --ink2:#AAB8B3; --accent:#5BC4A6; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui, sans-serif; padding:24px; text-align:center; }
  h1 { font-size:26px; margin:16px 0 8px; } p { color:var(--ink2); margin:0 0 20px; }
  button { border:0; border-radius:14px; padding:14px 22px; font:600 16px system-ui; background:var(--accent); color:#fff; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" width="64" height="64" alt="">
    <h1>Sem conexão</h1>
    <p>Assim que a internet voltar, a Nina continua de onde parou.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
